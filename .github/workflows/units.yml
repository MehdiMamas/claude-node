name: units

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stub claude so ExecStart resolves
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/.local/bin/claude"
          chmod +x "$HOME/.local/bin/claude"
      - name: Verify user units
        run: |
          out=$(systemd-analyze --user verify node/systemd/*.service 2>&1) || true
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
